<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кладбище любви</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b16;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .form-box {
            background: #16192b;
            border: 2px solid #ff4d4d;
            padding: 25px;
            width: 380px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(255, 77, 77, 0.3);
        }
        .form-box h2 {
            margin-top: 0;
            color: #ff4d4d;
            text-align: center;
            font-size: 22px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #b3b9d1;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
            background: #0f111a;
            border: 1px solid #2e3248;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            box-sizing: border-box;
            border-radius: 4px;
        }
        .form-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        .btn-submit {
            background: #ff4d4d;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
            width: 100%;
        }
        .btn-submit:hover { background: #ff3333; }
        .btn-cancel {
            background: #4a506d;
            color: white;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 10px;
            width: 100%;
        }
        .btn-cancel:hover { background: #5a6285; }
        .toggle-link {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
            color: #61afef;
            cursor: pointer;
            text-decoration: underline;
        }
        .btn-gen {
            background: #2e3248;
            border: none;
            color: #fff;
            padding: 8px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 12px;
            margin-top: 5px;
            width: 100%;
        }
        .btn-gen:hover { background: #3e4463; }
    </style>
    <!-- Подключаем Phaser 3 из CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <!-- Подключаем клиент Supabase для работы с бэкендом и почтой -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="game-container"></div>

    <!-- Модальное окно Авторизации / Регистрации -->
    <div id="auth-modal-overlay" class="modal-overlay">
        <div class="form-box">
            <h2 id="auth-title">Вход на кладбище</h2>
            <form id="authForm">
                <div class="form-group" id="nameGroup" style="display: none;">
                    <label>Имя персонажа:</label>
                    <input type="text" id="usernameInput" placeholder="Ваше имя">
                </div>
                <div class="form-group">
                    <label>Электронная почта:</label>
                    <input type="email" id="emailInput" placeholder="mail@example.com" required>
                </div>
                <div class="form-group" id="passGroup">
                    <label>Пароль:</label>
                    <input type="password" id="passwordInput" placeholder="Ваш пароль" required>
                </div>
                <button type="submit" class="btn-submit" id="authSubmitBtn">Войти</button>
                <div class="toggle-link" id="toggleAuthMode">Нет аккаунта? Зарегистрироваться</div>
                <button type="button" class="btn-cancel" id="closeAuthModal">Назад в меню</button>
            </form>
        </div>
    </div>

    <!-- HTML Форма создания захоронения -->
    <div id="grave-form-overlay" class="modal-overlay">
        <div class="form-box">
            <h2>Оформление мемориала</h2>
            <form id="graveForm">
                <div class="form-group">
                    <label>Тип памятника:</label>
                    <select id="tombstoneType">
                        <option value="0">1. Деревянный крест</option>
                        <option value="1">2. Каменная плита</option>
                        <option value="2">3. Мраморный обелиск</option>
                        <option value="3">4. Фигурный ангел</option>
                        <option value="4">5. Мемориальная ваза</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Инициалы (строго 2 буквы):</label>
                    <input type="text" id="initialsInput" maxlength="2" placeholder="АВ" required>
                </div>
                <div class="form-group">
                    <label>Эпитафия:</label>
                    <input type="text" id="epitaphInput" placeholder="Сгорел ярче всех...">
                    <button type="button" class="btn-gen" id="randomEpitaphBtn">Сгенерировать случайную</button>
                </div>
                <div style="font-size: 13px; color: #ffcc00; margin-bottom: 10px; text-align: center;">
                    Стоимость установки: 99.99 руб. (ЮKassa)
                </div>
                <div class="form-actions" style="gap: 10px;">
                    <button type="button" class="btn-cancel" id="cancelGraveBtn" style="margin:0;">Отмена</button>
                    <button type="submit" class="btn-submit" style="margin:0;">Оплатить и создать</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Инициализация Supabase (замените строки на ваши данные из панели Supabase)
        const SUPABASE_URL = 'https://jyqjxaoxdidswddhzjmk.supabase.co/';
        const SUPABASE_ANON_KEY = 'sb_publishable_sZmniaff_hZJCK22etZKMw_fBq8UAdf';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isRegisterMode = false;

        document.addEventListener('DOMContentLoaded', () => {
            const authOverlay = document.getElementById('auth-modal-overlay');
            const authTitle = document.getElementById('auth-title');
            const nameGroup = document.getElementById('nameGroup');
            const authSubmitBtn = document.getElementById('authSubmitBtn');
            const toggleAuthMode = document.getElementById('toggleAuthMode');
            const closeAuthModal = document.getElementById('closeAuthModal');
            const authForm = document.getElementById('authForm');

            toggleAuthMode.onclick = () => {
                isRegisterMode = !isRegisterMode;
                if (isRegisterMode) {
                    authTitle.innerText = 'Регистрация';
                    nameGroup.style.display = 'block';
                    authSubmitBtn.innerText = 'Зарегистрироваться';
                    toggleAuthMode.innerText = 'Уже есть аккаунт? Войти';
                } else {
                    authTitle.innerText = 'Вход на кладбище';
                    nameGroup.style.display = 'none';
                    authSubmitBtn.innerText = 'Войти';
                    toggleAuthMode.innerText = 'Нет аккаунта? Зарегистрироваться';
                }
            };

            closeAuthModal.onclick = () => {
                authOverlay.style.display = 'none';
            };

            // Реальная логика входа и регистрации через Supabase Auth
            authForm.onsubmit = async (e) => {
                e.preventDefault();
                const email = document.getElementById('emailInput').value;
                const password = document.getElementById('passwordInput').value;

                if (isRegisterMode) {
                    // Регистрация нового пользователя
                    const { data, error } = await supabaseClient.auth.signUp({
                        email: email,
                        password: password,
                    });

                    if (error) {
                        alert('Ошибка регистрации: ' + error.message);
                    } else {
                        alert('Регистрация успешна! Проверьте почту для подтверждения и получения доступа.');
                        authOverlay.style.display = 'none';
                        window.startGameScene();
                    }
                } else {
                    // Вход существующего пользователя
                    const { data, error } = await supabaseClient.auth.signInWithPassword({
                        email: email,
                        password: password,
                    });

                    if (error) {
                        alert('Ошибка входа: ' + error.message);
                    } else {
                        alert('Успешный вход! Добро пожаловать на кладбище.');
                        authOverlay.style.display = 'none';
                        window.startGameScene();
                    }
                }
            };
        });

        class MenuScene extends Phaser.Scene {
            constructor() {
                super('MenuScene');
            }

            create() {
                const width = this.scale.width;
                const height = this.scale.height;

                this.add.rectangle(0, 0, width, height, 0x0f111a).setOrigin(0);

                this.add.text(width / 2, height / 3 - 50, 'КЛАДБИЩЕ ЛЮБВИ', {
                    fontSize: '48px',
                    fill: '#ff4d4d',
                    fontStyle: 'bold',
                    align: 'center'
                }).setOrigin(0.5);

                this.add.text(width / 2, height / 3 + 10, '«Здесь покоятся те, кто сгорел ярче всех»', {
                    fontSize: '18px',
                    fill: '#8c92ac',
                    fontStyle: 'italic',
                    align: 'center'
                }).setOrigin(0.5);

                const btnBg = this.add.rectangle(width / 2, height / 2 + 50, 300, 60, 0x2e3248);
                const btnText = this.add.text(width / 2, height / 2 + 50, 'ВОЙТИ НА КЛАДБИЩЕ', {
                    fontSize: '20px',
                    fill: '#ffffff'
                }).setOrigin(0.5);

                btnBg.setInteractive({ useHandCursor: true });
                btnBg.on('pointerover', () => btnBg.setFillStyle(0x3e4463));
                btnBg.on('pointerout', () => btnBg.setFillStyle(0x2e3248));
                
                btnBg.on('pointerdown', () => {
                    document.getElementById('auth-modal-overlay').style.display = 'flex';
                });

                window.startGameScene = () => {
                    this.scene.start('GameScene');
                };
            }
        }

        class GameScene extends Phaser.Scene {
            constructor() {
                super('GameScene');
                this.selectedWorldX = 0;
                this.selectedWorldY = 0;
            }

            preload() {
                this.generatePseudo3DTextures();
            }

            generatePseudo3DTextures() {
                const graphics = this.make.graphics({ x: 0, y: 0, add: false });

                graphics.clear();
                graphics.fillStyle(0x000000, 0.4);
                graphics.fillEllipse(20, 54, 24, 10);
                graphics.fillStyle(0x654321, 1);
                graphics.fillRect(15, 8, 10, 48);
                graphics.fillStyle(0x8B4513, 1);
                graphics.fillRect(14, 6, 10, 48);
                graphics.fillRect(6, 16, 26, 10);
                graphics.generateTexture('tomb_0', 40, 60);

                graphics.clear();
                graphics.fillStyle(0x000000, 0.4);
                graphics.fillEllipse(20, 54, 28, 10);
                graphics.fillStyle(0x4b6584, 1);
                graphics.fillRoundedRect(4, 10, 32, 42, 6);
                graphics.fillStyle(0x778beb, 1);
                graphics.fillRoundedRect(6, 12, 28, 38, 4);
                graphics.fillStyle(0x2d3436, 1);
                graphics.fillRect(10, 18, 20, 16);
                graphics.generateTexture('tomb_1', 40, 60);

                graphics.clear();
                graphics.fillStyle(0x000000, 0.4);
                graphics.fillEllipse(20, 54, 26, 10);
                graphics.fillStyle(0xa4b0be, 1);
                graphics.beginPath();
                graphics.moveTo(20, 2);
                graphics.lineTo(36, 16);
                graphics.lineTo(34, 52);
                graphics.lineTo(6, 52);
                graphics.lineTo(4, 16);
                graphics.closePath();
                graphics.fillPath();
                graphics.fillStyle(0xf1f2f6, 1);
                graphics.fillRect(16, 6, 8, 46);
                graphics.generateTexture('tomb_2', 40, 60);

                graphics.clear();
                graphics.fillStyle(0x000000, 0.4);
                graphics.fillEllipse(20, 54, 26, 10);
                graphics.fillStyle(0x718093, 1);
                graphics.fillCircle(20, 16, 10);
                graphics.fillRect(12, 24, 16, 28);
                graphics.fillStyle(0xa4b0be, 1);
                graphics.fillCircle(20, 15, 8);
                graphics.generateTexture('tomb_3', 40, 60);

                graphics.clear();
                graphics.fillStyle(0x000000, 0.4);
                graphics.fillEllipse(20, 54, 28, 10);
                graphics.fillStyle(0x2f3640, 1);
                graphics.beginPath();
                graphics.moveTo(12, 20);
                graphics.lineTo(28, 20);
                graphics.lineTo(34, 50);
                graphics.lineTo(6, 50);
                graphics.closePath();
                graphics.fillPath();
                graphics.fillStyle(0x718093, 1);
                graphics.fillCircle(20, 14, 8);
                graphics.generateTexture('tomb_4', 40, 60);

                graphics.clear();
                graphics.fillStyle(0x000000, 0.4);
                graphics.fillEllipse(16, 52, 20, 8);
                graphics.fillStyle(0x2c3e50, 1);
                graphics.fillRect(10, 32, 12, 18);
                graphics.fillStyle(0x3498db, 1);
                graphics.fillRect(8, 16, 16, 18);
                graphics.fillStyle(0xf1c40f, 1);
                graphics.fillCircle(16, 10, 8);
                graphics.generateTexture('player_sprite', 32, 56);
            }

            create() {
                const mapWidth = 3000;
                const mapHeight = 3000;
                
                this.add.rectangle(0, 0, mapWidth, mapHeight, 0x1b241f).setOrigin(0);
                this.add.rectangle(1500, 0, 240, mapHeight, 0x2c2d30).setOrigin(0.5, 0);

                this.physics.world.setBounds(0, 0, mapWidth, mapHeight);

                this.player = this.add.sprite(1500, 1500, 'player_sprite');
                this.player.setOrigin(0.5, 0.85);
                this.physics.add.existing(this.player);
                this.player.body.setCollideWorldBounds(true);
                this.player.body.setSize(20, 16);
                this.player.body.setOffset(6, 36);

                this.cameras.main.setBounds(0, 0, mapWidth, mapHeight);
                this.cameras.main.startFollow(this.player, true, 0.09, 0.09);

                this.cursors = this.input.keyboard.createCursorKeys();
                this.wasd = this.input.keyboard.addKeys({
                    up: Phaser.Input.Keyboard.KeyCodes.W,
                    down: Phaser.Input.Keyboard.KeyCodes.S,
                    left: Phaser.Input.Keyboard.KeyCodes.A,
                    right: Phaser.Input.Keyboard.KeyCodes.D
                });

                this.input.on('pointerdown', (pointer) => {
                    if (document.getElementById('grave-form-overlay').style.display === 'flex') return;

                    const worldPoint = this.cameras.main.getWorldPoint(pointer.x, pointer.y);
                    this.selectedWorldX = worldPoint.x;
                    this.selectedWorldY = worldPoint.y;

                    document.getElementById('grave-form-overlay').style.display = 'flex';
                });

                this.setupHTMLFormHandlers();
                this.createUI();
            }

            setupHTMLFormHandlers() {
                const overlay = document.getElementById('grave-form-overlay');
                const form = document.getElementById('graveForm');
                const cancelBtn = document.getElementById('cancelGraveBtn');
                const randomBtn = document.getElementById('randomEpitaphBtn');
                const initialsInput = document.getElementById('initialsInput');

                initialsInput.addEventListener('input', (e) => {
                    let val = e.target.value.toUpperCase().replace(/[^А-ЯA-Z]/g, '');
                    if (val.length > 2) val = val.substring(0, 2);
                    e.target.value = val;
                });

                const randomPhrases = [
                    "Сгорел ярче всех в галактике",
                    "Обещал позвонить и пропал",
                    "Любил пиво больше, чем меня",
                    "Его шутки про бывших были смешнее",
                    "Покойся с миром, мой бывший курс",
                    "Сердце занято... под склад хлама"
                ];
                randomBtn.onclick = () => {
                    document.getElementById('epitaphInput').value = randomPhrases[Math.floor(Math.random() * randomPhrases.length)];
                };

                cancelBtn.onclick = () => {
                    overlay.style.display = 'none';
                };

                form.onsubmit = (e) => {
                    e.preventDefault();
                    const type = document.getElementById('tombstoneType').value;
                    const initials = initialsInput.value;
                    const epitaph = document.getElementById('epitaphInput').value || 'Вечная память';

                    if (initials.length < 2) {
                        alert('Введите ровно две буквы инициалов!');
                        return;
                    }

                    overlay.style.display = 'none';
                    form.reset();

                    this.triggerFuneralSequence(this.selectedWorldX, this.selectedWorldY, type, initials, epitaph);
                };
            }

            triggerFuneralSequence(x, y, type, initials, epitaph) {
                const hearse = this.add.rectangle(x - 400, y, 100, 50, 0x111111);
                hearse.setOrigin(0.5, 0.8);
                
                this.tweens.add({
                    targets: hearse,
                    x: x - 40,
                    duration: 2000,
                    ease: 'Power2',
                    onComplete: () => {
                        const tomb = this.add.sprite(x, y, `tomb_${type}`);
                        tomb.setOrigin(0.5, 1.0);
                        
                        const text = this.add.text(x, y - 35, initials, {
                            fontSize: '11px',
                            fill: '#fff',
                            fontStyle: 'bold',
                            backgroundColor: '#00000077',
                            padding: { x: 2, y: 1 }
                        }).setOrigin(0.5, 1.0);

                        tomb.setDepth(y);
                        text.setDepth(y + 1);

                        this.tweens.add({
                            targets: hearse,
                            x: x + 400,
                            duration: 2000,
                            delay: 1000,
                            ease: 'Power2',
                            onComplete: () => {
                                hearse.destroy();
                            }
                        });
                    }
                });
            }

            createUI() {
                const uiText = this.add.text(20, 20, '🏆 Достижение разблокировано:\n«Первый блин комом»\n\n💡 Кликните в любое место кладбища,\nчтобы создать захоронение (99.99₽)', {
                    fontSize: '15px',
                    fill: '#ffcc00',
                    backgroundColor: '#000000aa',
                    padding: { x: 12, y: 12 }
                });
                uiText.setScrollFactor(0);

                this.time.delayedCall(8000, () => {
                    this.tweens.add({
                        targets: uiText,
                        alpha: 0,
                        duration: 1000,
                        onComplete: () => uiText.destroy()
                    });
                });
            }

            update() {
                if (document.getElementById('grave-form-overlay').style.display === 'flex' || 
                    document.getElementById('auth-modal-overlay').style.display === 'flex') {
                    this.player.body.setVelocity(0);
                    return;
                }

                const speed = 200;
                const body = this.player.body;

                body.setVelocity(0);

                if (this.cursors.left.isDown || this.wasd.left.isDown) {
                    body.setVelocityX(-speed);
                } else if (this.cursors.right.isDown || this.wasd.right.isDown) {
                    body.setVelocityX(speed);
                }

                if (this.cursors.up.isDown || this.wasd.up.isDown) {
                    body.setVelocityY(-speed);
                } else if (this.cursors.down.isDown || this.wasd.down.isDown) {
                    body.setVelocityY(speed);
                }

                this.player.setDepth(this.player.y);
            }
        }

        const config = {
            type: Phaser.AUTO,
            width: window.innerWidth,
            height: window.innerHeight,
            parent: 'game-container',
            pixelArt: true,
            physics: {
                default: 'arcade',
                arcade: {
                    gravity: { y: 0 },
                    debug: false
                }
            },
            scene: [MenuScene, GameScene]
        };

        const game = new Phaser.Game(config);

        window.addEventListener('resize', () => {
            game.scale.resize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
