<!DOCTYPE html>

<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cemetery of Love — Кладбище Любви</title>

    <style>

        * {

            box-sizing: border-box;

            user-select: none;

        }

        body, html {

            margin: 0;

            padding: 0;

            width: 100%;

            height: 100%;

            background-color: #12141a;

            overflow: hidden;

            font-family: 'Courier New', Courier, monospace;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

        }

        h1 {

            margin: 5px 0 10px 0;

            font-size: 22px;

            color: #fff;

            text-shadow: 2px 2px #ff0055, -1px -1px #00f0ff;

            letter-spacing: 2px;

            text-transform: uppercase;

        }

        #game-container {

            position: relative;

            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.85);

            border: 4px solid #333a4d;

            border-radius: 6px;

            overflow: hidden;

            background: #1f3720;

            max-width: 95vw;

            max-height: 82vh;

        }

        canvas {

            display: block;

            width: 100%;

            height: auto;

            cursor: crosshair;

            image-rendering: pixelated;

        }

        .modal {

            display: none;

            position: absolute;

            top: 50%;

            left: 50%;

            transform: translate(-50%, -50%);

            background: #1b1e2b;

            border: 3px solid #ff0055;

            padding: 20px 24px;

            border-radius: 6px;

            z-index: 20;

            text-align: center;

            box-shadow: 0 0 35px rgba(0, 0, 0, 0.9), 0 0 20px rgba(255, 0, 85, 0.4);

            min-width: 300px;

            color: #fff;

        }

        .modal h3 {

            margin: 0 0 14px 0;

            color: #ff77a9;

            font-size: 17px;

            letter-spacing: 1px;

            text-transform: uppercase;

        }

        .btn {

            background: #12141d;

            border: 2px solid #3f4663;

            color: #e2e8f0;

            padding: 10px 14px;

            margin: 6px 0;

            cursor: pointer;

            font-family: 'Courier New', Courier, monospace;

            font-size: 14px;

            font-weight: bold;

            transition: all 0.15s ease;

            border-radius: 4px;

            display: block;

            width: 100%;

            text-align: left;

        }

        .btn:hover {

            border-color: #00f0ff;

            background: #23283b;

            color: #fff;

            transform: translateX(2px);

        }

        .input-group {

            margin: 10px 0;

            text-align: left;

        }

        .input-group label {

            font-size: 12px;

            color: #94a3b8;

            display: block;

            margin-bottom: 4px;

        }

        .input-group input, .input-group textarea {

            width: 100%;

            background: #12141d;

            border: 2px solid #3f4663;

            color: #fff;

            padding: 8px;

            font-family: 'Courier New', Courier, monospace;

            border-radius: 4px;

            resize: none;

        }

        .input-group input:focus, .input-group textarea:focus {

            border-color: #ff0055;

            outline: none;

        }

        .row {

            display: flex;

            gap: 6px;

        }

        #delete-btn {

            border-color: #7f1d1d;

            color: #fca5a5;

            display: none;

        }

        #delete-btn:hover {

            border-color: #ef4444;

            background: #450a0a;

        }

        #cancel-btn {

            background: #2d1622;

            border-color: #ff0055;

            color: #ff99bb;

            margin-top: 10px;

            text-align: center;

        }

        #cancel-btn:hover {

            background: #4c1d32;

            color: #fff;

        }

        .pay-option {

            background: #222638;

            border: 2px dashed #00f0ff;

            padding: 10px;

            margin: 8px 0;

            cursor: pointer;

            border-radius: 4px;

            text-align: center;

        }

        .pay-option:hover {

            background: #2b304a;

        }

    </style>

</head>

<body>



    <h1>Cemetery of Love</h1>

    <div id="game-container">

        <canvas id="gameCanvas" width="960" height="640"></canvas>



        <!-- Модальное окно выбора надгробия и некролога -->

        <div id="modal" class="modal">

            <h3>Оформление участка</h3>

            <div class="input-group">

                <label>Тип памятника:</label>

                <button class="btn" onclick="selectType('cross')">✝ Каменный крест</button>

                <button class="btn" onclick="selectType('slab')">🪦 Гранитная плита</button>

                <button class="btn" onclick="selectType('urn')">🌹 Вазон с розами</button>

            </div>



            <div class="input-group">

                <label>Эпитафия / Некролог:</label>

                <textarea id="epitaphInput" rows="2" placeholder="Здесь покоится любовь с..."></textarea>

            </div>



            <div class="row">

                <button class="btn" style="text-align:center; background:#1b3b22; border-color:#22c55e;" onclick="generatePhrase()">✨ Сгенерировать</button>

            </div>



            <button class="btn" id="pay-proceed-btn" onclick="openPaymentModal()" style="background:#4338ca; border-color:#818cf8; text-align:center; margin-top:10px;">💳 Оплатить и установить</button>

            <button class="btn" id="delete-btn" onclick="deleteTombstone()">🗑 Убрать с участка</button>

            <button class="btn" id="cancel-btn" onclick="closeModal()">Отмена</button>

        </div>



        <!-- Модальное окно оплаты -->

        <div id="payModal" class="modal">

            <h3>Терминал ритуальных услуг</h3>

            <p style="font-size:13px; color:#cbd5e1; margin-bottom:12px;">Выберите способ оплаты вечной памяти:</p>

            

            <div class="pay-option" onclick="completePayment('card')">

                <strong>Банковская карта</strong><br><span style="font-size:11px; color:#94a3b8;">*Списание в рассрочку до конца света</span>

            </div>

            <div class="pay-option" onclick="completePayment('crypto')">

                <strong>Крипта Любви (LOVECOIN)</strong><br><span style="font-size:11px; color:#94a3b8;">*Без комиссии за разбитые сердца</span>

            </div>

            <div class="pay-option" onclick="completePayment('memories')">

                <strong>Оплатить тёплыми воспоминаниями</strong><br><span style="font-size:11px; color:#94a3b8;">*100% скидка на ностальгию</span>

            </div>



            <button class="btn" id="cancel-pay-btn" onclick="closePaymentModal()" style="background:#2d1622; border-color:#ff0055; color:#ff99bb; text-align:center; margin-top:10px;">Назад</button>

        </div>

    </div>



    <script>

        const TILE = 32;

        const COLS = 30;

        const ROWS = 20;



        const canvas = document.getElementById('gameCanvas');

        const ctx = canvas.getContext('2d');



        let gravesData = {};

        let selectedCell = null;

        let tempType = 'cross';

        let hoverCell = null;

        let animTime = 0;



        const randomPhrases = [

            "Умерло от «прочитано в 23:45»",

            "Сгорело в огне несбывшихся планов",

            "Погибло под тяжестью бытовых споров",

            "Не пережило совместный ремонт",

            "Задушено бытом и ретроградным Меркурием",

            "Почил в бозе после фразы «мне всё равно»",

            "Уснуло навеки под сериалы на фоне",

            "Разбилось о скалы суровой реальности"

        ];



        function loadGraves() {

            const saved = localStorage.getItem('cemetery_graves_v4');

            if (saved) {

                try {

                    gravesData = JSON.parse(saved);

                } catch (e) {

                    gravesData = {};

                }

            } else {

                const old = localStorage.getItem('cemetery_graves_v3');

                if (old) {

                    try {

                        const parsed = JSON.parse(old);

                        for (let k in parsed) {

                            gravesData[k] = { type: parsed[k], text: "Вечная память" };

                        }

                    } catch(e) {}

                }

            }

        }



        function saveGraves() {

            localStorage.setItem('cemetery_graves_v4', JSON.stringify(gravesData));

        }



        function isBlocked(c, r) {

            const midC = Math.floor(COLS / 2);

            const midR = Math.floor(ROWS / 2);

            if (c === 0 || c === COLS - 1 || r === 0 || r === ROWS - 1) return true;

            if (c === midC || r === midR) return true;

            if ((c === 3 || c === COLS - 4) && (r === 3 || r === ROWS - 4)) return true;

            return false;

        }



        function px(tileX, tileY, gx, gy, gw, gh, color) {

            ctx.fillStyle = color;

            ctx.fillRect(tileX + gx * 2, tileY + gy * 2, gw * 2, gh * 2);

        }



        function drawGrassTile(c, r) {

            const x = c * TILE;

            const y = r * TILE;

            ctx.fillStyle = (c + r) % 2 === 0 ? '#233d24' : '#1f3720';

            ctx.fillRect(x, y, TILE, TILE);



            const hash = (c * 73 + r * 37) % 11;

            px(x, y, 3, 4, 1, 2, '#2e522f');

            px(x, y, 11, 10, 1, 2, '#2e522f');

            if (hash === 2 || hash === 7) {

                px(x, y, 7, 7, 1, 1, '#f43f5e');

            }

        }



        function drawPathTile(c, r, isCross) {

            const x = c * TILE;

            const y = r * TILE;

            ctx.fillStyle = '#2c2927';

            ctx.fillRect(x, y, TILE, TILE);



            const stones = [

                [1, 1, 6, 6, '#57534e', '#78716c'],

                [8, 1, 7, 6, '#44403c', '#57534e'],

                [1, 8, 7, 7, '#44403c', '#57534e'],

                [9, 8, 6, 7, '#57534e', '#78716c']

            ];

            stones.forEach(([gx, gy, gw, gh, base, light]) => {

                px(x, y, gx, gy, gw, gh, base);

                px(x, y, gx, gy, gw - 1, 1, light);

            });



            if (isCross) {

                px(x, y, 6, 6, 4, 4, '#ff0055');

            }

        }



        function drawFenceTile(c, r) {

            const x = c * TILE;

            const y = r * TILE;

            const midC = Math.floor(COLS / 2);

            const midR = Math.floor(ROWS / 2);



            if (c === midC || r === midR) {

                drawPathTile(c, r, false);

                px(x, y, 0, 4, 2, 10, '#475569');

                px(x, y, 14, 4, 2, 10, '#475569');

                return;

            }



            px(x, y, 0, 10, 16, 6, '#334155');

            px(x, y, 0, 10, 16, 1, '#64748b');



            [3, 8, 13].forEach(bx => {

                px(x, y, bx, 3, 1, 8, '#0f172a');

                px(x, y, bx, 2, 1, 1, '#fbbf24');

            });

            px(x, y, 0, 5, 16, 1, '#1e293b');

            px(x, y, 0, 9, 16, 1, '#1e293b');

        }



        function drawTree(c, r) {

            const x = c * TILE;

            const y = r * TILE;



            ctx.fillStyle = 'rgba(10, 18, 12, 0.4)';

            ctx.beginPath();

            ctx.ellipse(x + 16, y + 26, 12, 5, 0, 0, Math.PI * 2);

            ctx.fill();



            px(x, y, 7, 10, 2, 4, '#3e2723');

            px(x, y, 4, 4, 8, 7, '#14331b');

            px(x, y, 5, 2, 6, 5, '#1e4626');

            px(x, y, 6, 3, 2, 2, '#2d6a3b');

        }



        function drawGrave(c, r, graveObj) {

            const x = c * TILE;

            const y = r * TILE;

            const type = graveObj.type;



            px(x, y, 3, 12, 10, 3, '#3e2723');

            px(x, y, 4, 11, 8, 1, '#4e342e');



            if (type === 'cross') {

                px(x, y, 7, 2, 2, 10, '#94a3b8');

                px(x, y, 4, 4, 8, 2, '#94a3b8');

                px(x, y, 7, 2, 1, 10, '#cbd5e1');

                px(x, y, 4, 4, 8, 1, '#cbd5e1');

            } else if (type === 'slab') {

                px(x, y, 4, 3, 8, 10, '#475569');

                px(x, y, 4, 3, 1, 10, '#94a3b8');

                px(x, y, 6, 6, 4, 1, '#cbd5e1');

                px(x, y, 7, 8, 2, 2, '#ff0055');

            } else if (type === 'urn') {

                px(x, y, 5, 8, 6, 5, '#78350f');

                px(x, y, 4, 7, 8, 1, '#92400e');

                px(x, y, 5, 4, 6, 3, '#15803d');

                px(x, y, 5, 3, 2, 2, '#ff0055');

                px(x, y, 9, 3, 2, 2, '#ff0055');

            }

        }



        function render(timestamp) {

            animTime = timestamp / 1000;

            ctx.clearRect(0, 0, canvas.width, canvas.height);



            const midC = Math.floor(COLS / 2);

            const midR = Math.floor(ROWS / 2);



            for (let r = 0; r < ROWS; r++) {

                for (let c = 0; c < COLS; c++) {

                    if (c === 0 || c === COLS - 1 || r === 0 || r === ROWS - 1) {

                        drawGrassTile(c, r);

                        drawFenceTile(c, r);

                    } else if (c === midC || r === midR) {

                        drawPathTile(c, r, c === midC && r === midR);

                    } else {

                        drawGrassTile(c, r);

                    }

                }

            }



            const treeSpots = [

                [3, 3], [COLS - 4, 3],

                [3, ROWS - 4], [COLS - 4, ROWS - 4],

                [3, Math.floor(ROWS/2)], [COLS - 4, Math.floor(ROWS/2)]

            ];

            treeSpots.forEach(([tc, tr]) => drawTree(tc, tr));



            if (hoverCell && !isBlocked(hoverCell.c, hoverCell.r)) {

                const hx = hoverCell.c * TILE;

                const hy = hoverCell.r * TILE;

                const pulse = Math.sin(animTime * 6) * 0.2 + 0.8;

                ctx.strokeStyle = `rgba(0, 240, 255, ${pulse})`;

                ctx.lineWidth = 2;

                ctx.strokeRect(hx + 1, hy + 1, TILE - 2, TILE - 2);



                const key = `${hoverCell.c}_${hoverCell.r}`;

                if (gravesData[key] && gravesData[key].text) {

                    ctx.fillStyle = 'rgba(18, 20, 26, 0.9)';

                    ctx.fillRect(hx, hy - 24, 120, 20);

                    ctx.strokeStyle = '#ff0055';

                    ctx.strokeRect(hx, hy - 24, 120, 20);

                    ctx.fillStyle = '#fff';

                    ctx.font = '10px Courier New';

                    ctx.fillText(gravesData[key].text.substring(0, 18) + '...', hx + 4, hy - 10);

                }

            }



            for (const key in gravesData) {

                const [c, r] = key.split('_').map(Number);

                if (c < COLS && r < ROWS) {

                    drawGrave(c, r, gravesData[key]);

                }

            }



            requestAnimationFrame(render);

        }



        canvas.addEventListener('mousemove', (e) => {

            const rect = canvas.getBoundingClientRect();

            const scaleX = canvas.width / rect.width;

            const scaleY = canvas.height / rect.height;

            const x = (e.clientX - rect.left) * scaleX;

            const y = (e.clientY - rect.top) * scaleY;



            const c = Math.floor(x / TILE);

            const r = Math.floor(y / TILE);

            hoverCell = { c, r };

            canvas.style.cursor = isBlocked(c, r) ? 'default' : 'pointer';

        });



        canvas.addEventListener('mouseleave', () => {

            hoverCell = null;

        });



        canvas.addEventListener('click', (e) => {

            const rect = canvas.getBoundingClientRect();

            const scaleX = canvas.width / rect.width;

            const scaleY = canvas.height / rect.height;

            const x = (e.clientX - rect.left) * scaleX;

            const y = (e.clientY - rect.top) * scaleY;



            const c = Math.floor(x / TILE);

            const r = Math.floor(y / TILE);



            if (isBlocked(c, r)) return;



            selectedCell = { col: c, row: r };

            const key = `${c}_${r}`;

            

            if (gravesData[key]) {

                tempType = gravesData[key].type;

                document.getElementById('epitaphInput').value = gravesData[key].text || '';

                document.getElementById('delete-btn').style.display = 'block';

            } else {

                tempType = 'cross';

                document.getElementById('epitaphInput').value = '';

                document.getElementById('delete-btn').style.display = 'none';

            }



            document.getElementById('modal').style.display = 'block';

        });



        function selectType(type) {

            tempType = type;

        }



        function generatePhrase() {

            const rnd = randomPhrases[Math.floor(Math.random() * randomPhrases.length)];

            document.getElementById('epitaphInput').value = rnd;

        }



        function openPaymentModal() {

            document.getElementById('modal').style.display = 'none';

            document.getElementById('payModal').style.display = 'block';

        }



        function closePaymentModal() {

            document.getElementById('payModal').style.display = 'none';

            document.getElementById('modal').style.display = 'block';

        }



        function completePayment(method) {

            if (!selectedCell) return;

            const key = `${selectedCell.col}_${selectedCell.row}`;

            const text = document.getElementById('epitaphInput').value || 'Вечная память';



            gravesData[key] = {

                type: tempType,

                text: text,

                payment: method

            };



            saveGraves();

            document.getElementById('payModal').style.display = 'none';

            selectedCell = null;

        }



        function deleteTombstone() {

            if (!selectedCell) return;

            const key = `${selectedCell.col}_${selectedCell.row}`;

            delete gravesData[key];

            saveGraves();

            closeModal();

        }



        function closeModal() {

            document.getElementById('modal').style.display = 'none';

            document.getElementById('payModal').style.display = 'none';

            selectedCell = null;

        }



        loadGraves();

        requestAnimationFrame(render);

    </script>

</body>

</html>
