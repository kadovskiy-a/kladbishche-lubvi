<!DOCTYPE html>

<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cemetery of Love — Кладбище Любви</title>

    <style>

        * {

            box-sizing: border-box;

            user-select: none;

        }

        body, html {

            margin: 0;

            padding: 0;

            width: 100%;

            height: 100%;

            background-color: #12141a;

            overflow: hidden;

            font-family: 'Courier New', Courier, monospace;

        }

        canvas {

            display: block;

            width: 100vw;

            height: 100vh;

            cursor: crosshair;

            image-rendering: pixelated;

        }

        /* Плавающий заголовок в стиле 80-х */

        #hud-header {

            position: fixed;

            top: 14px;

            left: 50%;

            transform: translateX(-50%);

            background: rgba(18, 20, 28, 0.85);

            border: 2px solid #ff0055;

            box-shadow: 0 0 15px rgba(255, 0, 85, 0.45);

            padding: 8px 24px;

            border-radius: 4px;

            color: #fff;

            font-size: 20px;

            font-weight: bold;

            letter-spacing: 3px;

            text-transform: uppercase;

            text-shadow: 2px 2px #ff0055, -1px -1px #00f0ff;

            pointer-events: none;

            z-index: 5;

        }

        /* Модальное окно выбора надгробия */

        #modal {

            display: none;

            position: fixed;

            top: 50%;

            left: 50%;

            transform: translate(-50%, -50%);

            background: #1b1e2b;

            border: 3px solid #ff0055;

            padding: 22px 26px;

            border-radius: 6px;

            z-index: 20;

            text-align: center;

            box-shadow: 0 0 35px rgba(0, 0, 0, 0.9), 0 0 20px rgba(255, 0, 85, 0.4);

            min-width: 260px;

        }

        #modal h3 {

            margin: 0 0 16px 0;

            color: #ff77a9;

            font-size: 18px;

            letter-spacing: 1px;

            text-transform: uppercase;

        }

        .tombstone-btn {

            background: #12141d;

            border: 2px solid #3f4663;

            color: #e2e8f0;

            padding: 12px 16px;

            margin: 8px 0;

            cursor: pointer;

            font-family: 'Courier New', Courier, monospace;

            font-size: 15px;

            font-weight: bold;

            transition: all 0.15s ease;

            border-radius: 4px;

            display: block;

            width: 100%;

            text-align: left;

        }

        .tombstone-btn:hover {

            border-color: #00f0ff;

            background: #23283b;

            color: #fff;

            transform: translateX(3px);

        }

        #delete-btn {

            border-color: #7f1d1d;

            color: #fca5a5;

            display: none;

        }

        #delete-btn:hover {

            border-color: #ef4444;

            background: #450a0a;

        }

        #cancel-btn {

            background: #2d1622;

            border-color: #ff0055;

            color: #ff99bb;

            margin-top: 14px;

            text-align: center;

        }

        #cancel-btn:hover {

            background: #4c1d32;

            color: #fff;

        }

    </style>

</head>

<body>



    <div id="hud-header">Cemetery of Love</div>

    <canvas id="gameCanvas"></canvas>



    <div id="modal">

        <h3>Выбор памятника</h3>

        <button class="tombstone-btn" onclick="selectTombstone('cross')">✝ Каменный крест</button>

        <button class="tombstone-btn" onclick="selectTombstone('slab')">🪦 Гранитная плита</button>

        <button class="tombstone-btn" onclick="selectTombstone('urn')">🌹 Вазон с алыми розами</button>

        <button class="tombstone-btn" id="delete-btn" onclick="deleteTombstone()">🗑 Убрать с участка</button>

        <button class="tombstone-btn" id="cancel-btn" onclick="closeModal()">Отмена</button>

    </div>



    <script>

        const TILE = 48; // Крупный чёткий пиксель-арт тайл (16x16 виртуальных пикселей * 3)

        const P = 3;     // Размер одного "пикселя"



        const canvas = document.getElementById('gameCanvas');

        const ctx = canvas.getContext('2d');



        let cols = 0;

        let rows = 0;

        let gravesData = {};

        let selectedCell = null;

        let hoverCell = null;

        let trees = [];

        let lanterns = [];

        let animTime = 0;



        // Загрузка сохранений

        function loadGraves() {

            const saved = localStorage.getItem('cemetery_graves_v2') || localStorage.getItem('cemetery_graves');

            if (saved) {

                try {

                    gravesData = JSON.parse(saved);

                } catch (e) {

                    gravesData = {};

                }

            }

        }



        function saveGraves() {

            localStorage.setItem('cemetery_graves_v2', JSON.stringify(gravesData));

        }



        // Расстановка декораций под текущий размер экрана

        function buildLayout() {

            canvas.width = window.innerWidth;

            canvas.height = window.innerHeight;

            cols = Math.ceil(canvas.width / TILE);

            rows = Math.ceil(canvas.height / TILE);



            const midC = Math.floor(cols / 2);

            const midR = Math.floor(rows / 2);



            trees = [];

            lanterns = [];



            // Расставляем деревья по углам и вдоль периметра (внутри ограды)

            const treeSpots = [

                [2, 2], [4, 2], [2, 4],

                [cols - 3, 2], [cols - 5, 2], [cols - 3, 4],

                [2, rows - 3], [4, rows - 3], [2, rows - 5],

                [cols - 3, rows - 3], [cols - 5, rows - 3], [cols - 3, rows - 5],

                [midC - 3, 2], [midC + 3, 2],

                [midC - 3, rows - 3], [midC + 3, rows - 3]

            ];



            treeSpots.forEach(([c, r], idx) => {

                if (c > 1 && c < cols - 2 && r > 1 && r < rows - 2 && c !== midC && r !== midR) {

                    trees.push({ c, r, type: idx % 2 === 0 ? 'oak' : 'cypress' });

                }

            });



            // Фонари вдоль центральных аллей

            for (let c = 3; c < cols - 3; c += 5) {

                if (Math.abs(c - midC) > 1) {

                    lanterns.push({ c, r: midR - 1 });

                }

            }

            for (let r = 3; r < rows - 3; r += 4) {

                if (Math.abs(r - midR) > 1) {

                    lanterns.push({ c: midC - 1, r });

                }

            }

        }



        function isBlocked(c, r) {

            const midC = Math.floor(cols / 2);

            const midR = Math.floor(rows / 2);

            // Периметр (забор)

            if (c <= 0 || c >= cols - 1 || r <= 0 || r >= rows - 1) return true;

            // Главные дорожки

            if (c === midC || r === midR) return true;

            // Деревья и фонари

            if (trees.some(t => t.c === c && t.r === r)) return true;

            if (lanterns.some(l => l.c === c && l.r === r)) return true;

            return false;

        }



        // Вспомогательная функция рисования пикселей внутри тайла (сетка 16x16)

        function px(tileX, tileY, gx, gy, gw, gh, color) {

            ctx.fillStyle = color;

            ctx.fillRect(tileX + gx * P, tileY + gy * P, gw * P, gh * P);

        }



        function drawGrassTile(c, r) {

            const x = c * TILE;

            const y = r * TILE;

            const isAlt = (c + r) % 2 === 0;

            ctx.fillStyle = isAlt ? '#233d24' : '#1f3720';

            ctx.fillRect(x, y, TILE, TILE);



            // Детализация травинок (детерминированный псевдорандом по координатам)

            const hash = (c * 73 + r * 37) % 11;

            px(x, y, 3, 4, 1, 2, '#2e522f');

            px(x, y, 4, 3, 1, 2, '#376138');

            px(x, y, 11, 10, 1, 2, '#2e522f');

            px(x, y, 12, 11, 1, 2, '#182b19');



            if (hash === 2 || hash === 7) {

                // Мелкие полевые цветы

                px(x, y, 7, 7, 1, 1, '#f43f5e');

                px(x, y, 8, 8, 1, 1, '#fda4af');

            } else if (hash === 5) {

                px(x, y, 10, 4, 1, 1, '#cbd5e1');

            }

        }



        function drawPathTile(c, r, isCross) {

            const x = c * TILE;

            const y = r * TILE;

            // Подложка раствора

            ctx.fillStyle = '#2c2927';

            ctx.fillRect(x, y, TILE, TILE);



            // Каменная брусчатка

            const stones = [

                [1, 1, 6, 4, '#57534e', '#78716c'],

                [8, 1, 7, 4, '#44403c', '#57534e'],

                [1, 6, 4, 4, '#44403c', '#57534e'],

                [6, 6, 5, 4, '#57534e', '#78716c'],

                [12, 6, 3, 4, '#44403c', '#57534e'],

                [1, 11, 7, 4, '#57534e', '#78716c'],

                [9, 11, 6, 4, '#44403c', '#57534e']

            ];

            stones.forEach(([gx, gy, gw, gh, base, light]) => {

                px(x, y, gx, gy, gw, gh, base);

                px(x, y, gx, gy, gw - 1, 1, light);

            });



            if (isCross) {

                // Декоративный центр перекрестка

                px(x, y, 5, 5, 6, 6, '#334155');

                px(x, y, 6, 6, 4, 4, '#ff0055');

            }

        }



        function drawFenceTile(c, r) {

            const x = c * TILE;

            const y = r * TILE;

            const midC = Math.floor(cols / 2);

            const midR = Math.floor(rows / 2);



            // Ворота на пересечении с дорожками

            if (c === midC || r === midR) {

                drawPathTile(c, r, false);

                // Каменные столбы ворот по бокам

                px(x, y, 0, 2, 3, 12, '#475569');

                px(x, y, 13, 2, 3, 12, '#475569');

                px(x, y, 0, 1, 3, 1, '#94a3b8');

                px(x, y, 13, 1, 3, 1, '#94a3b8');

                return;

            }



            // Каменный цоколь

            px(x, y, 0, 11, 16, 5, '#334155');

            px(x, y, 0, 11, 16, 1, '#64748b');



            // Кованые прутья и пики

            const bars = [2, 6, 10, 14];

            bars.forEach(bx => {

                px(x, y, bx, 3, 1, 8, '#0f172a');

                px(x, y, bx, 2, 1, 1, '#fbbf24'); // Золотые наконечники пик

            });

            // Горизонтальные перекладины

            px(x, y, 0, 5, 16, 1, '#1e293b');

            px(x, y, 0, 9, 16, 1, '#1e293b');

        }



        function drawTree(c, r, type) {

            const x = c * TILE;

            const y = r * TILE;



            // Тень на траве

            ctx.fillStyle = 'rgba(10, 18, 12, 0.45)';

            ctx.beginPath();

            ctx.ellipse(x + 24, y + 40, 18, 7, 0, 0, Math.PI * 2);

            ctx.fill();



            if (type === 'cypress') {

                // Ствол

                px(x, y, 7, 12, 2, 3, '#3e2723');

                // Узкий высокий кипарис

                px(x, y, 5, 8, 6, 5, '#14331b');

                px(x, y, 6, 4, 4, 5, '#1b4324');

                px(x, y, 7, 1, 2, 4, '#245830');

                px(x, y, 6, 5, 1, 6, '#2d6a3b'); // Блик слева

            } else {

                // Раскидистое дерево

                px(x, y, 6, 11, 4, 4, '#4e342e');

                px(x, y, 7, 11, 1, 4, '#6d4c41');

                // Крона

                px(x, y, 2, 5, 12, 6, '#14331b');

                px(x, y, 3, 2, 10, 5, '#1e4626');

                px(x, y, 4, 3, 4, 3, '#2d6a3b'); // Светлая листва

                px(x, y, 9, 6, 4, 3, '#102815'); // Глубокая тень

            }

        }



        function drawLantern(c, r) {

            const x = c * TILE;

            const y = r * TILE;

            const flicker = Math.sin(animTime * 6 + c + r) * 0.12 + 0.88;



            // Тёплое свечение вокруг фонаря

            const grad = ctx.createRadialGradient(x + 24, y + 18, 4, x + 24, y + 18, 46 * flicker);

            grad.addColorStop(0, 'rgba(255, 190, 60, 0.35)');

            grad.addColorStop(1, 'rgba(255, 190, 60, 0)');

            ctx.fillStyle = grad;

            ctx.fillRect(x - 24, y - 24, TILE + 48, TILE + 48);



            // Столб фонаря

            px(x, y, 6, 13, 4, 2, '#1e293b');

            px(x, y, 7, 6, 2, 7, '#334155');

            // Плафон

            px(x, y, 6, 3, 4, 3, '#fef08a');

            px(x, y, 7, 4, 2, 2, '#ffffff');

            // Крышка

            px(x, y, 5, 2, 6, 1, '#0f172a');

            px(x, y, 7, 1, 2, 1, '#0f172a');

        }



        function drawGrave(c, r, type) {

            const x = c * TILE;

            const y = r *
