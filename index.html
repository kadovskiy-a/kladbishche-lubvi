<!DOCTYPE html>

<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cemetery of Love - Кладбище Любви</title>

    <style>

        body {

            margin: 0;

            padding: 0;

            background-color: #1a1c23;

            color: #fff;

            font-family: 'Courier New', Courier, monospace;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            min-height: 100vh;

            overflow: hidden;

        }

        h1 {

            margin: 10px 0;

            font-size: 24px;

            text-shadow: 2px 2px #ff0055;

            letter-spacing: 2px;

        }

        #game-container {

            position: relative;

            box-shadow: 0 10px 30px rgba(0,0,0,0.8);

            border: 4px solid #333a4d;

            border-radius: 4px;

            overflow: hidden;

            background: #243b22;

        }

        canvas {

            display: block;

            cursor: pointer;

        }

        /* Модальное окно выбора надгробия */

        #modal {

            display: none;

            position: absolute;

            top: 50%;

            left: 50%;

            transform: translate(-50%, -50%);

            background: #252836;

            border: 3px solid #ff0055;

            padding: 20px;

            border-radius: 8px;

            z-index: 10;

            text-align: center;

            box-shadow: 0 0 20px rgba(255, 0, 85, 0.4);

        }

        #modal h3 {

            margin-top: 0;

            color: #ff77a9;

        }

        .tombstone-btn {

            background: #1a1c23;

            border: 2px solid #555;

            color: #fff;

            padding: 10px 15px;

            margin: 5px;

            cursor: pointer;

            font-family: 'Courier New', Courier, monospace;

            font-weight: bold;

            transition: 0.2s;

            border-radius: 4px;

            display: block;

            width: 180px;

        }

        .tombstone-btn:hover {

            border-color: #ff0055;

            background: #2d3246;

        }

        #cancel-btn {

            background: #441a22;

            border-color: #ff4444;

            margin-top: 10px;

        }

        #cancel-btn:hover {

            background: #66222b;

        }

    </style>

</head>

<body>



    <h1>Cemetery of Love</h1>

    <div id="game-container">

        <canvas id="gameCanvas" width="640" height="480"></canvas>

        <!-- Модальное окно выбора -->

        <div id="modal">

            <h3>Выбор надгробия</h3>

            <button class="tombstone-btn" onclick="selectTombstone('cross')">✝ Крест</button>

            <button class="tombstone-btn" onclick="selectTombstone('slab')">🏛 Плита (Стела)</button>

            <button class="tombstone-btn" onclick="selectTombstone('urn')">🏺 Урна с цветами</button>

            <button class="tombstone-btn" id="cancel-btn" onclick="closeModal()">Отмена</button>

        </div>

    </div>



    <script>

        const GRID_SIZE = 32;

        const COLS = 20;

        const ROWS = 15;



        const canvas = document.getElementById('gameCanvas');

        const ctx = canvas.getContext('2d');



        let gravesData = {};

        let selectedCell = null;



        // Загрузка сохраненных могил

        function loadGraves() {

            const saved = localStorage.getItem('cemetery_graves');

            if (saved) {

                try {

                    gravesData = JSON.parse(saved);

                } catch(e) {

                    console.error("Ошибка загрузки", e);

                }

            }

        }



        function saveGraves() {

            localStorage.setItem('cemetery_graves', JSON.stringify(gravesData));

        }



        function drawGame() {

            ctx.clearRect(0, 0, canvas.width, canvas.height);



            // 1. Рисуем траву и дорожки

            for (let r = 0; r < ROWS; r++) {

                for (let c = 0; c < COLS; c++) {

                    let color = (r + c) % 2 === 0 ? '#2e4a2b' : '#284025';

                    if (c === Math.floor(COLS/2) || r === Math.floor(ROWS/2)) {

                        color = '#4d4233'; // Дорожка

                    }

                    ctx.fillStyle = color;

                    ctx.fillRect(c * GRID_SIZE, r * GRID_SIZE, GRID_SIZE, GRID_SIZE);

                }

            }



            // 2. Рисуем забор по периметру

            for (let c = 0; c < COLS; c++) {

                drawFencePart(c * GRID_SIZE, 0);

                drawFencePart(c * GRID_SIZE, (ROWS - 1) * GRID_SIZE);

            }

            for (let r = 1; r < ROWS - 1; r++) {

                drawFencePart(0, r * GRID_SIZE);

                drawFencePart((COLS - 1) * GRID_SIZE, r * GRID_SIZE);

            }



            // 3. Рисуем пиксельные деревья по углам

            drawPixelTree(3, 3);

            drawPixelTree(COLS - 4, 3);

            drawPixelTree(3, ROWS - 4);

            drawPixelTree(COLS - 4, ROWS - 4);



            // 4. Рисуем надгробия

            for (const key in gravesData) {

                const [c, r] = key.split('_').map(Number);

                const x = c * GRID_SIZE;

                const y = r * GRID_SIZE;

                const type = gravesData[key];



                // Хохолок земли

                ctx.fillStyle = '#3b2b1e';

                ctx.beginPath();

                ctx.ellipse(x + 16, y + 22, 12, 6, 0, 0, Math.PI * 2);

                ctx.fill();



                if (type === 'cross') {

                    ctx.fillStyle = '#d3d3d3';

                    ctx.fillRect(x + 14, y + 8, 4, 16);

                    ctx.fillRect(x + 10, y + 12, 12, 4);

                } else if (type === 'slab') {

                    ctx.fillStyle = '#8a95a5';

                    ctx.fillRect(x + 10, y + 6, 12, 18);

                    ctx.fillStyle = '#4a5568';

                    ctx.fillRect(x + 12, y + 10, 8, 10);

                } else if (type === 'urn') {

                    ctx.fillStyle = '#a0522d';

                    ctx.fillRect(x + 11, y + 12, 10, 10);

                    ctx.fillStyle = '#ff0055';

                    ctx.beginPath();

                    ctx.arc(x + 16, y + 9, 5, 0, Math.PI * 2);

                    ctx.fill();

                }

            }

        }



        function drawFencePart(x, y) {

            ctx.fillStyle = '#5c4033';

            ctx.fillRect(x + 8, y + 8, 16, 16);

            ctx.fillStyle = '#7c5a45';

            ctx.fillRect(x + 12, y + 4, 8, 24);

        }



        function drawPixelTree(col, row) {

            const tx = col * GRID_SIZE;

            const ty = row * GRID_SIZE;

            

            // Ствол

            ctx.fillStyle = '#3d2817';

            ctx.fillRect(tx + 12, ty + 18, 8, 10);

            

            // Крона

            ctx.fillStyle = '#1b3b1a';

            ctx.beginPath();

            ctx.moveTo(tx + 16, ty + 2);

            ctx.lineTo(tx + 28, ty + 18);

            ctx.lineTo(tx + 4, ty + 18);

            ctx.fill();



            ctx.fillStyle = '#2d5a27';

            ctx.beginPath();

            ctx.moveTo(tx + 16, ty + 8);

            ctx.lineTo(tx + 24, ty + 22);

            ctx.lineTo(tx + 8, ty + 22);

            ctx.fill();

        }



        // Клик по холсту для установки надгробия

        canvas.addEventListener('click', (event) => {

            const rect = canvas.getBoundingClientRect();

            const x = event.clientX - rect.left;

            const y = event.clientY - rect.top;

            

            const col = Math.floor(x / GRID_SIZE);

            const row = Math.floor(y / GRID_SIZE);



            // Запрет ставить на дорожки и забор

            if (col === 0 || col === COLS - 1 || row === 0 || row === ROWS - 1) return;

            if (col === Math.floor(COLS/2) || row === Math.floor(ROWS/2)) return;



            selectedCell = { col, row };

            document.getElementById('modal').style.display = 'block';

        });



        function selectTombstone(type) {

            if (!selectedCell) return;

            const key = `${selectedCell.col}_${selectedCell.row}`;

            gravesData[key] = type;

            saveGraves();

            drawGame();

            closeModal();

        }



        function closeModal() {

            document.getElementById('modal').style.display = 'none';

            selectedCell = null;

        }



        // Инициализация

        loadGraves();

        drawGame();

    </script>

</body>

</html>
