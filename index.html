<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кладбище любви</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b16;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .form-box {
            background: #16192b;
            border: 2px solid #ff4d4d;
            padding: 25px;
            width: 380px;
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(255, 77, 77, 0.4);
        }
        .form-box h2 {
            margin-top: 0;
            color: #ff4d4d;
            text-align: center;
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #b3b9d1;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
            background: #0f111a;
            border: 1px solid #2e3248;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            box-sizing: border-box;
            border-radius: 4px;
        }
        .form-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            gap: 10px;
        }
        .btn-submit {
            background: #ff4d4d;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
            width: 100%;
            text-transform: uppercase;
        }
        .btn-submit:hover { background: #ff3333; }
        .btn-cancel {
            background: #4a506d;
            color: white;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 4px;
            width: 100%;
        }
        .btn-cancel:hover { background: #5a6285; }
        .toggle-link {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
            color: #61afef;
            cursor: pointer;
            text-decoration: underline;
        }
        .btn-gen {
            background: #2e3248;
            border: none;
            color: #fff;
            padding: 8px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 12px;
            margin-top: 5px;
            width: 100%;
        }
        .btn-gen:hover { background: #3e4463; }
    </style>
    <!-- Phaser 3 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="game-container"></div>

    <!-- Модальное окно Авторизации -->
    <div id="auth-modal-overlay" class="modal-overlay">
        <div class="form-box">
            <h2 id="auth-title">Вход на кладбище</h2>
            <form id="authForm">
                <div class="form-group" id="nameGroup" style="display: none;">
                    <label>Имя персонажа:</label>
                    <input type="text" id="usernameInput" placeholder="Ваше имя">
                </div>
                <div class="form-group">
                    <label>Электронная почта / Логин:</label>
                    <input type="text" id="emailInput" placeholder="admin или mail@example.com" required>
                </div>
                <div class="form-group">
                    <label>Пароль:</label>
                    <input type="password" id="passwordInput" placeholder="admin или пароль" required>
                </div>
                <button type="submit" class="btn-submit" id="authSubmitBtn">Войти</button>
                <div class="toggle-link" id="toggleAuthMode">Нет аккаунта? Зарегистрироваться</div>
                <button type="button" class="btn-cancel" id="closeAuthModal">Назад в меню</button>
            </form>
        </div>
    </div>

    <!-- Модальное окно создания могилы -->
    <div id="grave-form-overlay" class="modal-overlay">
        <div class="form-box">
            <h2>Оформление мемориала</h2>
            <form id="graveForm">
                <div class="form-group">
                    <label>Тип памятника:</label>
                    <select id="tombstoneType">
                        <option value="0">1. Готическая стела с крестом</option>
                        <option value="1">2. Округлый мемориальный камень</option>
                        <option value="2">3. Прямоугольная плита</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Инициалы (строго 2 буквы):</label>
                    <input type="text" id="initialsInput" maxlength="2" placeholder="АК" required>
                </div>
                <div class="form-group">
                    <label>Эпитафия:</label>
                    <input type="text" id="epitaphInput" placeholder="Сгорел ярче всех...">
                    <button type="button" class="btn-gen" id="randomEpitaphBtn">Сгенерировать случайную</button>
                </div>
                <div style="font-size: 13px; color: #ffcc00; margin-bottom: 10px; text-align: center;">
                    Установка мемориала: 99.99 руб.
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-cancel" id="cancelGraveBtn">Отмена</button>
                    <button type="submit" class="btn-submit">Установить</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://jynyjxaoxdidswddhzhm.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_szmni...'; 
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isRegisterMode = false;

        document.addEventListener('DOMContentLoaded', () => {
            const authOverlay = document.getElementById('auth-modal-overlay');
            const authTitle = document.getElementById('auth-title');
            const nameGroup = document.getElementById('nameGroup');
            const authSubmitBtn = document.getElementById('authSubmitBtn');
            const toggleAuthMode = document.getElementById('toggleAuthMode');
            const closeAuthModal = document.getElementById('closeAuthModal');
            const authForm = document.getElementById('authForm');

            toggleAuthMode.onclick = () => {
                isRegisterMode = !isRegisterMode;
                if (isRegisterMode) {
                    authTitle.innerText = 'Регистрация';
                    nameGroup.style.display = 'block';
                    authSubmitBtn.innerText = 'Зарегистрироваться';
                    toggleAuthMode.innerText = 'Уже есть аккаунт? Войти';
                } else {
                    authTitle.innerText = 'Вход на кладбище';
                    nameGroup.style.display = 'none';
                    authSubmitBtn.innerText = 'Войти';
                    toggleAuthMode.innerText = 'Нет аккаунта? Зарегистрироваться';
                }
            };

            closeAuthModal.onclick = () => {
                authOverlay.style.display = 'none';
            };

            authForm.onsubmit = async (e) => {
                e.preventDefault();
                const email = document.getElementById('emailInput').value.trim();
                const password = document.getElementById('passwordInput').value.trim();

                if (!isRegisterMode && email === 'admin' && password === 'admin') {
                    alert('Вход выполнен под учетной записью администратора!');
                    authOverlay.style.display = 'none';
                    window.startGameScene();
                    return;
                }

                if (isRegisterMode) {
                    const { data, error } = await supabaseClient.auth.signUp({ email, password });
                    if (error) {
                        alert('Ошибка регистрации: ' + error.message);
                    } else {
                        alert('Регистрация успешна! Проверьте почту.');
                        authOverlay.style.display = 'none';
                        window.startGameScene();
                    }
                } else {
                    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                    if (error) {
                        alert('Ошибка входа: ' + error.message);
                    } else {
                        alert('Вход выполнен успешно!');
                        authOverlay.style.display = 'none';
                        window.startGameScene();
                    }
                }
            };
        });

        class MenuScene extends Phaser.Scene {
            constructor() { super('MenuScene'); }

            create() {
                const width = this.scale.width;
                const height = this.scale.height;

                this.add.rectangle(0, 0, width, height, 0x070710).setOrigin(0);
                
                const g = this.add.graphics();
                g.lineStyle(2, 0xff4d4d, 0.2);
                for (let i = 0; i < height; i += 40) {
                    g.lineBetween(0, i, width, i);
                }

                this.add.text(width / 2, height / 3 - 60, 'КЛАДБИЩЕ ЛЮБВИ', {
                    fontSize: '52px',
                    fill: '#ff4d4d',
                    fontStyle: 'bold',
                    align: 'center',
                    shadow: { offsetX: 3, offsetY: 3, color: '#000', blur: 0, fill: true }
                }).setOrigin(0.5);

                this.add.text(width / 2, height / 3 + 10, '«Здесь покоятся те, кто сгорел ярче всех»', {
                    fontSize: '18px',
                    fill: '#00ffff',
                    fontStyle: 'italic',
                    align: 'center'
                }).setOrigin(0.5);

                const btnBg = this.add.rectangle(width / 2, height / 2 + 60, 320, 65, 0x16192b);
                btnBg.setStrokeStyle(2, 0xff4d4d);
                const btnText = this.add.text(width / 2, height / 2 + 60, 'ВОЙТИ НА КЛАДБИЩЕ', {
                    fontSize: '20px',
                    fill: '#ffffff',
                    fontStyle: 'bold'
                }).setOrigin(0.5);

                btnBg.setInteractive({ useHandCursor: true });
                btnBg.on('pointerover', () => {
                    btnBg.setFillStyle(0xff4d4d);
                    btnText.setFill(0x000000);
                });
                btnBg.on('pointerout', () => {
                    btnBg.setFillStyle(0x16192b);
                    btnText.setFill(0xffffff);
                });
                btnBg.on('pointerdown', () => {
                    document.getElementById('auth-modal-overlay').style.display = 'flex';
                });

                window.startGameScene = () => {
                    this.scene.start('GameScene');
                };
            }
        }

        class GameScene extends Phaser.Scene {
            constructor() {
                super('GameScene');
                this.selectedWorldX = 0;
                this.selectedWorldY = 0;
            }

            preload() {
                this.generateReferenceGraphics();
            }

            generateReferenceGraphics() {
                const g = this.make.graphics({ x: 0, y: 0, add: false });

                // 1. Текстура земли (мрачный мохнатый газон с туманным оттенком)
                g.clear();
                g.fillStyle(0x3e524d, 1);
                g.fillRect(0, 0, 64, 64);
                g.fillStyle(0x4a635c, 1);
                g.fillRect(2, 2, 60, 60);
                g.fillStyle(0x56756c, 1);
                g.fillRect(10, 14, 6, 4);
                g.fillRect(38, 42, 8, 5);
                g.generateTexture('ground_tile', 64, 64);

                // 2. Брусчатая аллея
                g.clear();
                g.fillStyle(0x2f3542, 1);
                g.fillRect(0, 0, 64, 64);
                g.fillStyle(0x57606f, 1);
                g.fillRect(4, 4, 56, 56);
                g.lineStyle(1, 0x1e272e, 1);
                g.strokeRect(4, 4, 56, 56);
                g.generateTexture('path_tile', 64, 64);

                // 3. Часовня (левый архитектурный объект)
                g.clear();
                g.fillStyle(0x000000, 0.6);
                g.fillEllipse(90, 175, 160, 40);
                // Стены часовни (кирпич/камень)
                g.fillStyle(0xc8b8a6, 1);
                g.fillRect(30, 40, 120, 120);
                g.fillStyle(0xb5a28e, 1);
                g.fillRect(35, 45, 110, 110);
                // Дверной проем
                g.fillStyle(0x3d2817, 1);
                g.fillRoundedRect(70, 90, 40, 70, { tl: 20, tr: 20, bl: 0, br: 0 });
                // Крыша (треугольная черепица)
                g.fillStyle(0x7a6352, 1);
                g.beginPath();
                g.moveTo(90, 2);
                g.lineTo(165, 45);
                g.lineTo(15, 45);
                g.closePath();
                g.fillPath();
                // Крест на крыше
                g.fillStyle(0xecd8c2, 1);
                g.fillRect(86, -10, 8, 25);
                g.fillRect(78, -2, 24, 8);
                g.generateTexture('chapel_building', 180, 180);

                // 4. Готический склеп (по центру сверху)
                g.clear();
                g.fillStyle(0x000000, 0.6);
                g.fillEllipse(65, 135, 120, 30);
                g.fillStyle(0xc8b8a6, 1);
                g.fillRect(20, 30, 90, 90);
                // Дверь склепа
                g.fillStyle(0x2d1e12, 1);
                g.fillRoundedRect(45, 60, 40, 60, { tl: 20, tr: 20, bl: 0, br: 0 });
                // Крыша
                g.fillStyle(0x6b5344, 1);
                g.beginPath();
                g.moveTo(65, 2);
                g.lineTo(120, 32);
                g.lineTo(10, 32);
                g.closePath();
                g.fillPath();
                g.generateTexture('crypt_building', 130, 140);

                // 5. Старое сухое дерево с изогнутыми ветвями
                g.clear();
                g.fillStyle(0x000000, 0.6);
                g.fillEllipse(50, 140, 60, 20);
                g.fillStyle(0x3a2818, 1);
                g.fillRect(40, 50, 20, 90);
                // Ветви
                g.lineStyle(6, 0x3a2818, 1);
                g.strokeLineShape(new Phaser.Geom.Line(50, 70, 15, 40));
                g.strokeLineShape(new Phaser.Geom.Line(50, 60, 85, 35));
                g.strokeLineShape(new Phaser.Geom.Line(30, 50, 5, 20));
                g.generateTexture('old_tree', 100, 150);

                // 6. Кованая ограда (секция)
                g.clear();
                g.fillStyle(0x222629, 1);
                g.fillRect(0, 16, 64, 8);
                g.fillRect(0, 40, 64, 8);
                // Пики ограды
                for (let px = 6; px < 64; px += 16) {
                    g.fillRect(px, 4, 4, 44);
                    g.beginPath();
                    g.moveTo(px - 2, 4);
                    g.lineTo(px + 2, 4);
                    g.lineTo(px + 2, -4);
                    g.closePath();
                    g.fillPath();
                }
                g.generateTexture('fence_section', 64, 48);

                // 7. Фонарный столб
                g.clear();
                g.fillStyle(0x000000, 0.5);
                g.fillEllipse(16, 75, 20, 10);
                g.fillStyle(0x1e2226, 1);
                g.fillRect(12, 16, 8, 60);
                g.fillStyle(0xf1c40f, 1); // Светящийся фонарь
                g.fillRect(6, 4, 20, 16);
                g.generateTexture('lamp_post', 32, 80);

                // 8. Надгробия в точном стиле референса
                // Тип 0: Готическая стела с крестом
                g.clear();
                g.fillStyle(0x000000, 0.6);
                g.fillEllipse(24, 60, 36, 12);
                g.fillStyle(0xa39b90, 1);
                g.fillRoundedRect(6, 12, 36, 46, { tl: 14, tr: 14, bl: 2, br: 2 });
                g.fillStyle(0x7c7368, 1);
                g.fillRoundedRect(9, 15, 30, 40, { tl: 12, tr: 12, bl: 1, br: 1 });
                g.fillStyle(0x3a342e, 1);
                g.fillRect(14, 24, 20, 22);
                // Крест на вершине
                g.fillStyle(0xa39b90, 1);
                g.fillRect(21, 2, 6, 14);
                g.fillRect(17, 6, 14, 5);
                g.generateTexture('tomb_0', 48, 68);

                // Тип 1: Округлый мемориальный камень
                g.clear();
                g.fillStyle(0x000000, 0.6);
                g.fillEllipse(24, 60, 38, 12);
                g.fillStyle(0x948c82, 1);
                g.fillCircle(24, 30, 20);
                g.fillRect(4, 30, 40, 30);
                g.fillStyle(0x6e665d, 1);
                g.fillCircle(24, 30, 17);
                g.fillRect(7, 30, 34, 26);
                g.generateTexture('tomb_1', 48, 68);

                // Тип 2: Прямоугольная гранитная плита
                g.clear();
                g.fillStyle(0x000000, 0.6);
                g.fillEllipse(24, 60, 40, 12);
                g.fillStyle(0x857d74, 1);
                g.fillRect(4, 18, 40, 42);
                g.fillStyle(0x5c554e, 1);
                g.fillRect(7, 21, 34, 36);
                g.generateTexture('tomb_2', 48, 68);

                // 9. Спрайт главного героя
                g.clear();
                g.fillStyle(0x000000, 0.6);
                g.fillEllipse(16, 56, 22, 12);
                g.fillStyle(0x2c2c38, 1);
                g.fillRect(9, 28, 14, 24);
                g.fillStyle(0xc0392b, 1);
                g.fillRect(9, 16, 14, 16);
                g.fillStyle(0xf1c40f, 1); // Блонд волосы
                g.fillRect(9, 4, 14, 8);
                g.generateTexture('player_sprite', 32, 60);

                // 10. Катафалк
                g.clear();
                g.fillStyle(0x000000, 0.7);
                g.fillEllipse(70, 48, 120, 20);
                g.fillStyle(0x111217, 1);
                g.fillRoundedRect(10, 15, 120, 32, 6);
                g.fillStyle(0x1a1d24, 1);
                g.fillRoundedRect(35, 6, 60, 22, 4);
                g.fillStyle(0x0b0b0b, 1);
                g.fillCircle(30, 44, 10);
                g.fillCircle(105, 44, 10);
                g.fillStyle(0xdcdde1, 1);
                g.fillCircle(30, 44, 4);
                g.fillCircle(105, 44, 4);
                g.generateTexture('hearse_sprite', 140, 60);
            }

            create() {
                const mapWidth = 3200;
                const mapHeight = 3200;

                // Земля и центральная аллея
                this.add.tileSprite(0, 0, mapWidth, mapHeight, 'ground_tile').setOrigin(0);
                this.add.tileSprite(1600, 0, 320, mapHeight, 'path_tile').setOrigin(0.5, 0);

                // --- РАЗМЕЩЕНИЕ ОБЪЕКТОВ ОКРУЖЕНИЯ КАК НА РЕФЕРЕНСЕ ---
                
                // Часовня слева вверху
                const chapel = this.add.sprite(400, 450, 'chapel_building');
                chapel.setOrigin(0.5, 0.8);
                chapel.setDepth(450);

                // Скрипт / склеп рядом
                const crypt = this.add.sprite(800, 480, 'crypt_building');
                crypt.setOrigin(0.5, 0.8);
                crypt.setDepth(480);

                // Старое дерево
                const bigTree = this.add.sprite(1200, 420, 'old_tree');
                bigTree.setOrigin(0.5, 0.85);
                bigTree.setDepth(420);

                // Фонарный столб на аллее
                const lamp = this.add.sprite(1680, 1500, 'lamp_post');
                lamp.setOrigin(0.5, 0.9);
                lamp.setDepth(1500);

                // Кованая ограда по периметру нижней части
                for (let fx = 100; fx < 3100; fx += 64) {
                    const fence = this.add.sprite(fx, 2800, 'fence_section');
                    fence.setOrigin(0, 1);
                    fence.setDepth(2800);
                }

                // Фоновые надгробия на северной поляне
                for (let gx = 1300; gx < 2200; gx += 120) {
                    const bgTomb = this.add.sprite(gx, 500 + (gx % 70), 'tomb_0');
                    bgTomb.setOrigin(0.5, 1);
                    bgTomb.setDepth(500 + (gx % 70));
                }

                this.physics.world.setBounds(0, 0, mapWidth, mapHeight);

                // Игрок
                this.player = this.add.sprite(1600, 1600, 'player_sprite');
                this.player.setOrigin(0.5, 0.85);
                this.physics.add.existing(this.player);
                this.player.body.setCollideWorldBounds(true);
                this.player.body.setSize(20, 16);
                this.player.body.setOffset(6, 40);

                this.cameras.main.setBounds(0, 0, mapWidth, mapHeight);
                this.cameras.main.startFollow(this.player, true, 0.08, 0.08);

                this.cursors = this.input.keyboard.createCursorKeys();
                this.wasd = this.input.keyboard.addKeys({
                    up: Phaser.Input.Keyboard.KeyCodes.W,
                    down: Phaser.Input.Keyboard.KeyCodes.S,
                    left: Phaser.Input.Keyboard.KeyCodes.A,
                    right: Phaser.Input.Keyboard.KeyCodes.D
                });

                this.input.on('pointerdown', (pointer) => {
                    if (document.getElementById('grave-form-overlay').style.display === 'flex' ||
                        document.getElementById('auth-modal-overlay').style.display === 'flex') return;

                    const worldPoint = this.cameras.main.getWorldPoint(pointer.x, pointer.y);
                    this.selectedWorldX = worldPoint.x;
                    this.selectedWorldY = worldPoint.y;

                    document.getElementById('grave-form-overlay').style.display = 'flex';
                });

                this.setupHTMLFormHandlers();
                this.createUI();
            }

            setupHTMLFormHandlers() {
                const overlay = document.getElementById('grave-form-overlay');
                const form = document.getElementById('graveForm');
                const cancelBtn = document.getElementById('cancelGraveBtn');
                const randomBtn = document.getElementById('randomEpitaphBtn');
                const initialsInput = document.getElementById('initialsInput');

                initialsInput.addEventListener('input', (e) => {
                    let val = e.target.value.toUpperCase().replace(/[^А-ЯA-Z]/g, '');
                    if (val.length > 2) val = val.substring(0, 2);
                    e.target.value = val;
                });

                const randomPhrases = [
                    "Сгорел ярче всех в галактике",
                    "Обещал позвонить и пропал",
                    "Любил пиво больше, чем меня",
                    "Его шутки про бывших были смешнее",
                    "Покойся с миром, мой бывший курс",
                    "Сердце занято... под склад хлама"
                ];
                randomBtn.onclick = () => {
                    document.getElementById('epitaphInput').value = randomPhrases[Math.floor(Math.random() * randomPhrases.length)];
                };

                cancelBtn.onclick = () => {
                    overlay.style.display = 'none';
                };

                form.onsubmit = (e) => {
                    e.preventDefault();
                    const type = document.getElementById('tombstoneType').value;
                    const initials = initialsInput.value;
                    const epitaph = document.getElementById('epitaphInput').value || 'Вечная память';

                    if (initials.length < 2) {
                        alert('Введите ровно две буквы инициалов!');
                        return;
                    }

                    overlay.style.display = 'none';
                    form.reset();

                    this.spawnGrave(this.selectedWorldX, this.selectedWorldY, type, initials, epitaph);
                };
            }

            spawnGrave(x, y, type, initials, epitaph) {
                const hearse = this.add.sprite(x - 500, y, 'hearse_sprite');
                hearse.setOrigin(0.5, 0.8);
                hearse.setDepth(y + 100);

                this.tweens.add({
                    targets: hearse,
                    x: x - 40,
                    duration: 1800,
                    ease: 'Power2',
                    onComplete: () => {
                        const tomb = this.add.sprite(x, y, `tomb_${type}`);
                        tomb.setOrigin(0.5, 1.0);
                        
                        const text = this.add.text(x, y - 48, initials, {
                            fontSize: '12px',
                            fill: '#f1c40f',
                            fontStyle: 'bold',
                            backgroundColor: '#000000cc',
                            padding: { x: 4, y: 2 }
                        }).setOrigin(0.5, 1.0);

                        tomb.setDepth(y);
                        text.setDepth(y + 1);

                        this.tweens.add({
                            targets: hearse,
                            x: x + 500,
                            duration: 1800,
                            delay: 1000,
                            ease: 'Power2',
                            onComplete: () => hearse.destroy()
                        });
                    }
                });
            }

            createUI() {
                const uiText = this.add.text(25, 25, '🏆 Режим: Кладбище в стиле референса\n\n💡 Кликните в любое место для установки мемориала', {
                    fontSize: '15px',
                    fill: '#00ffff',
                    backgroundColor: '#070710cc',
                    padding: { x: 12, y: 12 }
                });
                uiText.setScrollFactor(0);
                uiText.setDepth(9999);

                this.time.delayedCall(7000, () => {
                    this.tweens.add({
                        targets: uiText,
                        alpha: 0,
                        duration: 1000,
                        onComplete: () => uiText.destroy()
                    });
                });
            }

            update() {
                if (document.getElementById('grave-form-overlay').style.display === 'flex' || 
                    document.getElementById('auth-modal-overlay').style.display === 'flex') {
                    this.player.body.setVelocity(0);
                    return;
                }

                const speed = 220;
                const body = this.player.body;
                body.setVelocity(0);

                if (this.cursors.left.isDown || this.wasd.left.isDown) {
                    body.setVelocityX(-speed);
                } else if (this.cursors.right.isDown || this.wasd.right.isDown) {
                    body.setVelocityX(speed);
                }

                if (this.cursors.up.isDown || this.wasd.up.isDown) {
                    body.setVelocityY(-speed);
                } else if (this.cursors.down.isDown || this.wasd.down.isDown) {
                    body.setVelocityY(speed);
                }

                this.player.setDepth(this.player.y);
            }
        }

        const config = {
            type: Phaser.AUTO,
            width: window.innerWidth,
            height: window.innerHeight,
            parent: 'game-container',
            pixelArt: true,
            roundPixels: true,
            physics: {
                default: 'arcade',
                arcade: { gravity: { y: 0 }, debug: false }
            },
            scene: [MenuScene, GameScene]
        };

        const game = new Phaser.Game(config);

        window.addEventListener('resize', () => {
            game.scale.resize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
