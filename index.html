<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cemetery of Love — Кладбище Любви (Phaser Edition)</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0d12;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Стили для UI и модальных окон поверх Phaser */
        #hud-header {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(18, 20, 28, 0.9);
            border: 2px solid #ff0055;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.5);
            padding: 8px 24px;
            border-radius: 4px;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 2px 2px #ff0055, -1px -1px #00f0ff;
            z-index: 10;
            pointer-events: none;
        }
        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1b1e2b;
            border: 3px solid #ff0055;
            padding: 22px 26px;
            border-radius: 6px;
            z-index: 30;
            text-align: center;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.95), 0 0 25px rgba(255, 0, 85, 0.4);
            min-width: 320px;
            color: #fff;
        }
        .modal h3 {
            margin: 0 0 14px 0;
            color: #ff77a9;
            font-size: 18px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .btn {
            background: #12141d;
            border: 2px solid #3f4663;
            color: #e2e8f0;
            padding: 10px 14px;
            margin: 6px 0;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.15s ease;
            border-radius: 4px;
            display: block;
            width: 100%;
            text-align: left;
        }
        .btn:hover {
            border-color: #00f0ff;
            background: #23283b;
            color: #fff;
            transform: translateX(2px);
        }
        .input-group {
            margin: 10px 0;
            text-align: left;
        }
        .input-group label {
            font-size: 12px;
            color: #94a3b8;
            display: block;
            margin-bottom: 4px;
        }
        .input-group input, .input-group textarea {
            width: 100%;
            background: #12141d;
            border: 2px solid #3f4663;
            color: #fff;
            padding: 8px;
            font-family: 'Courier New', Courier, monospace;
            border-radius: 4px;
            resize: none;
        }
        .input-group input:focus, .input-group textarea:focus {
            border-color: #ff0055;
            outline: none;
        }
        .row {
            display: flex;
            gap: 6px;
        }
        #delete-btn {
            border-color: #7f1d1d;
            color: #fca5a5;
            display: none;
        }
        #delete-btn:hover {
            border-color: #ef4444;
            background: #450a0a;
        }
        #cancel-btn {
            background: #2d1622;
            border-color: #ff0055;
            color: #ff99bb;
            margin-top: 10px;
            text-align: center;
        }
        #cancel-btn:hover {
            background: #4c1d32;
            color: #fff;
        }
        .pay-option {
            background: #222638;
            border: 2px dashed #00f0ff;
            padding: 10px;
            margin: 8px 0;
            cursor: pointer;
            border-radius: 4px;
            text-align: center;
            transition: 0.2s;
        }
        .pay-option:hover {
            background: #2b304a;
            border-color: #ff0055;
        }
    </style>
    <!-- Подключаем современный движок Phaser 3 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>
</head>
<body>

    <div id="hud-header">Cemetery of Love</div>
    <div id="game-container"></div>

    <!-- Модальное окно оформления -->
    <div id="modal" class="modal">
        <h3>Оформление участка</h3>
        <div class="input-group">
            <label>Тип памятника:</label>
            <button class="btn" onclick="selectType('cross')">✝ Каменный крест</button>
            <button class="btn" onclick="selectType('slab')">🪦 Гранитная плита</button>
            <button class="btn" onclick="selectType('urn')">🌹 Вазон с розами</button>
        </div>

        <div class="input-group">
            <label>Дополнительный декор:</label>
            <button class="btn" onclick="toggleDecor('fence')" id="decorFenceBtn">🔲 Кованая оградка: ВЫКЛ</button>
            <button class="btn" onclick="toggleDecor('flowers')" id="decorFlowersBtn">💐 Живые цветы: ВЫКЛ</button>
        </div>

        <div class="input-group">
            <label>Эпитафия / Некролог:</label>
            <textarea id="epitaphInput" rows="2" placeholder="Здесь покоится любовь с..."></textarea>
        </div>

        <div class="row">
            <button class="btn" style="text-align:center; background:#1b3b22; border-color:#22c55e;" onclick="generatePhrase()">✨ Сгенерировать</button>
        </div>

        <button class="btn" onclick="openPaymentModal()" style="background:#4338ca; border-color:#818cf8; text-align:center; margin-top:10px;">💳 Оплатить и установить</button>
        <button class="btn" id="delete-btn" onclick="deleteTombstone()">🗑 Убрать с участка</button>
        <button class="btn" id="cancel-btn" onclick="closeModal()">Отмена</button>
    </div>

    <!-- Модальное окно оплаты -->
    <div id="payModal" class="modal">
        <h3>Терминал ритуальных услуг</h3>
        <p style="font-size:13px; color:#cbd5e1; margin-bottom:12px;">Выберите способ оплаты вечной памяти:</p>
        
        <div class="pay-option" onclick="completePayment('card')">
            <strong>Банковская карта</strong><br><span style="font-size:11px; color:#94a3b8;">*Списание в рассрочку до конца света</span>
        </div>
        <div class="pay-option" onclick="completePayment('crypto')">
            <strong>Крипта Любви (LOVECOIN)</strong><br><span style="font-size:11px; color:#94a3b8;">*Без комиссии за разбитые сердца</span>
        </div>
        <div class="pay-option" onclick="completePayment('memories')">
            <strong>Оплатить тёплыми воспоминаниями</strong><br><span style="font-size:11px; color:#94a3b8;">*100% скидка на ностальгию</span>
        </div>

        <button class="btn" onclick="closePaymentModal()" style="background:#2d1622; border-color:#ff0055; color:#ff99bb; text-align:center; margin-top:10px;">Назад</button>
    </div>

    <script>
        const TILE = 48; // Увеличили масштаб для движка Phaser
        const COLS = 32;
        const ROWS = 24;

        let gravesData = {};
        let selectedCell = null;
        let tempType = 'cross';
        let tempDecor = { fence: false, flowers: false };

        const randomPhrases = [
            "Умерло от «прочитано в 23:45»",
            "Сгорело в огне несбывшихся планов",
            "Погибло под тяжестью бытовых споров",
            "Не пережило совместный ремонт",
            "Задушено бытом и ретроградным Меркурием",
            "Почил в бозе после фразы «мне всё равно»",
            "Уснуло навеки под сериалы на фоне",
            "Разбилось о скалы суровой реальности"
        ];

        function loadGraves() {
            const saved = localStorage.getItem('cemetery_graves_phaser');
            if (saved) {
                try { gravesData = JSON.parse(saved); } catch(e) { gravesData = {}; }
            }
        }

        function saveGraves() {
            localStorage.setItem('cemetery_graves_phaser', JSON.stringify(gravesData));
        }

        loadGraves();

        // Конфигурация Phaser 3 игры
        class CemeteryScene extends Phaser.Scene {
            constructor() {
                super('CemeteryScene');
            }

            create() {
                this.graphics = this.add.graphics();
                
                // Настраиваем камеру с возможностью плавного зума и перетаскивания
                this.cameras.main.setBounds(-200, -200, COLS * TILE + 400, ROWS * TILE + 400);
                
                // Интерактив кликов по сетке
                this.input.on('pointerdown', (pointer) => {
                    const worldPoint = this.cameras.main.getWorldPoint(pointer.x, pointer.y);
                    const c = Math.floor(worldPoint.x / TILE);
                    const r = Math.floor(worldPoint.y / TILE);

                    const midC = Math.floor(COLS / 2);
                    const midR = Math.floor(ROWS / 2);

                    // Проверка на зоны (забор, дорожки)
                    if (c <= 0 || c >= COLS - 1 || r <= 0 || r >= ROWS - 1) return;
                    if (c === midC || r === midR) return;

                    selectedCell = { col: c, row: r };
                    const key = `${c}_${r}`;

                    if (gravesData[key]) {
                        tempType = gravesData[key].type;
                        tempDecor = gravesData[key].decor ? { ...gravesData[key].decor } : { fence: false, flowers: false };
                        document.getElementById('epitaphInput').value = gravesData[key].text || '';
                        document.getElementById('delete-btn').style.display = 'block';
                    } else {
                        tempType = 'cross';
                        tempDecor = { fence: false, flowers: false };
                        document.getElementById('epitaphInput').value = '';
                        document.getElementById('delete-btn').style.display = 'none';
                    }

                    updateDecorButtons();
                    document.getElementById('modal').style.display = 'block';
                });
            }

            update(time, delta) {
                this.graphics.clear();
                const midC = Math.floor(COLS / 2);
                const midR = Math.floor(ROWS / 2);

                // 1. Отрисовка земли и дорожек
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        const x = c * TILE;
                        const y = r * TILE;

                        if (c === 0 || c === COLS - 1 || r === 0 || r === ROWS - 1) {
                            this.graphics.fillStyle((c + r) % 2 === 0 ? 0x233d24 : 0x1f3720);
                            this.graphics.fillRect(x, y, TILE, TILE);
                            // Забор
                            this.graphics.fillStyle(0x334155);
                            this.graphics.fillRect(x + 4, y + 20, TILE - 8, 12);
                            this.graphics.fillStyle(0xfbbf24);
                            this.graphics.fillRect(x + TILE/2 - 2, y + 4, 4, 16);
                        } else if (c === midC || r === midR) {
                            this.graphics.fillStyle(0x2c2927);
                            this.graphics.fillRect(x, y, TILE, TILE);
                            this.graphics.lineStyle(1, 0x44403c);
                            this.graphics.strokeRect(x, y, TILE, TILE);
                        } else {
                            this.graphics.fillStyle((c + r) % 2 === 0 ? 0x233d24 : 0x1f3720);
                            this.graphics.fillRect(x, y, TILE, TILE);
                        }
                    }
                }

                // 2. Отрисовка памятников
                for (const key in gravesData) {
                    const [c, r] = key.split('_').map(Number);
                    const x = c * TILE;
                    const y = r * TILE;
                    const grave = gravesData[key];

                    // Холмик
                    this.graphics.fillStyle(0x3e2723);
                    this.graphics.fillEllipse(x + TILE/2, y + TILE - 10, TILE * 0.6, TILE * 0.3);

                    // Декор (оградка)
                    if (grave.decor && grave.decor.fence) {
                        this.graphics.lineStyle(2, 0x475569);
                        this.graphics.strokeRect(x + 4, y + 4, TILE - 8, TILE - 8);
                    }

                    // Памятник
                    if (grave.type === 'cross') {
                        this.graphics.fillStyle(0x94a3b8);
                        this.graphics.fillRect(x + TILE/2 - 4, y + 8, 8, TILE - 16);
                        this.graphics.fillRect(x + TILE/2 - 12, y + 14, 24, 8);
                    } else if (grave.type === 'slab') {
                        this.graphics.fillStyle(0x475569);
                        this.graphics.fillRect(x + TILE/2 - 12, y + 6, 24, TILE - 12);
                        this.graphics.fillStyle(0xff0055);
                        this.graphics.fillCircle(x + TILE/2, y + TILE/2, 4);
                    } else if (grave.type === 'urn') {
                        this.graphics.fillStyle(0x78350f);
                        this.graphics.fillRect(x + TILE/2 - 10, y + TILE/2, 20, 16);
                        this.graphics.fillStyle(0xff0055);
                        this.graphics.fillCircle(x + TILE/2 - 6, y + TILE/2 - 4, 6);
                        this.graphics.fillCircle(x + TILE/2 + 6, y + TILE/2 - 4, 6);
                    }
                }
            }
        }

        const config = {
            type: Phaser.AUTO,
            width: window.innerWidth,
            height: window.innerHeight,
            parent: 'game-container',
            backgroundColor: '#12141a',
            scene: CemeteryScene
        };

        const game = new Phaser.Game(config);

        window.addEventListener('resize', () => {
            game.scale.resize(window.innerWidth, window.innerHeight);
        });

        // Интерфейсные функции
        function selectType(type) { tempType = type; }
        function toggleDecor(name) {
            tempDecor[name] = !tempDecor[name];
            document.getElementById('decorFenceBtn').innerText = `🔲 Кованая оградка: ${tempDecor.fence ? 'ВКЛ' : 'ВЫКЛ'}`;
            document.getElementById('decorFlowersBtn').innerText = `💐 Живые цветы: ${tempDecor.flowers ? 'ВКЛ' : 'ВЫКЛ'}`;
        }
        function updateDecorButtons() {
            document.getElementById('decorFenceBtn').innerText = `🔲 Кованая оградка: ${tempDecor.fence ? 'ВКЛ' : 'ВЫКЛ'}`;
            document.getElementById('decorFlowersBtn').innerText = `💐 Живые цветы: ${tempDecor.flowers ? 'ВКЛ' : 'ВЫКЛ'}`;
        }
        function generatePhrase() {
            document.getElementById('epitaphInput').value = randomPhrases[Math.floor(Math.random() * randomPhrases.length)];
        }
        function openPaymentModal() {
            document.getElementById('modal').style.display = 'none';
            document.getElementById('payModal').style.display = 'block';
        }
        function closePaymentModal() {
            document.getElementById('payModal').style.display = 'none';
            document.getElementById('modal').style.display = 'block';
        }
        function completePayment(method) {
            if (!selectedCell) return;
            const key = `${selectedCell.col}_${selectedCell.row}`;
            gravesData[key] = {
                type: tempType,
                text: document.getElementById('epitaphInput').value || 'Вечная память',
                decor: { ...tempDecor },
                payment: method
            };
            saveGraves();
            closeModal();
        }
        function deleteTombstone() {
            if (!selectedCell) return;
            delete gravesData[`${selectedCell.col}_${selectedCell.row}`];
            saveGraves();
            closeModal();
        }
        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            document.getElementById('payModal').style.display = 'none';
            selectedCell = null;
        }
    </script>
</body>
</html>
