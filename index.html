<!DOCTYPE html>

<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cemetery of Love - Кладбище Любви</title>

    <style>

        body {

            margin: 0;

            padding: 0;

            background-color: #1a1c23;

            color: #fff;

            font-family: 'Courier New', Courier, monospace;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            min-height: 100vh;

            overflow: hidden;

        }

        h1 {

            margin: 10px 0;

            font-size: 24px;

            text-shadow: 2px 2px #ff0055;

            letter-spacing: 2px;

        }

        #game-container {

            position: relative;

            box-shadow: 0 10px 30px rgba(0,0,0,0.8);

            border: 4px solid #333a4d;

            border-radius: 4px;

            overflow: hidden;

        }

        /* Модальное окно выбора надгробия */

        #modal {

            display: none;

            position: absolute;

            top: 50%;

            left: 50%;

            transform: translate(-50%, -50%);

            background: #252836;

            border: 3px solid #ff0055;

            padding: 20px;

            border-radius: 8px;

            z-index: 10;

            text-align: center;

            box-shadow: 0 0 20px rgba(255, 0, 85, 0.4);

        }

        #modal h3 {

            margin-top: 0;

            color: #ff77a9;

        }

        .tombstone-btn {

            background: #1a1c23;

            border: 2px solid #555;

            color: #fff;

            padding: 10px 15px;

            margin: 5px;

            cursor: pointer;

            font-family: 'Courier New', Courier, monospace;

            font-weight: bold;

            transition: 0.2s;

            border-radius: 4px;

            display: block;

            width: 180px;

        }

        .tombstone-btn:hover {

            border-color: #ff0055;

            background: #2d3246;

        }

        #cancel-btn {

            background: #441a22;

            border-color: #ff4444;

            margin-top: 10px;

        }

        #cancel-btn:hover {

            background: #66222b;

        }

    </style>

    <!-- Подключаем PixiJS для графики -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>

</head>

<body>



    <h1>Cemetery of Love</h1>

    <div id="game-container">

        <!-- Модальное окно выбора -->

        <div id="modal">

            <h3>Выбор надгробия</h3>

            <button class="tombstone-btn" onclick="selectTombstone('cross')">✝ Крест</button>

            <button class="tombstone-btn" onclick="selectTombstone('slab')">🏛 Плита (Стела)</button>

            <button class="tombstone-btn" onclick="selectTombstone('urn')">🏺 Урна с цветами</button>

            <button class="tombstone-btn" id="cancel-btn" onclick="closeModal()">Отмена</button>

        </div>

    </div>



    <script>

        const GRID_SIZE = 32;

        const COLS = 20;

        const ROWS = 15;

        const WIDTH = COLS * GRID_SIZE;

        const HEIGHT = ROWS * GRID_SIZE;



        const app = new PIXI.Application();

        

        async function initGame() {

            await app.init({ width: WIDTH, height: HEIGHT, backgroundColor: 0x243b22 });

            document.getElementById('game-container').appendChild(app.canvas);



            createEnvironment();

            loadGraves();



            app.ticker.add((delta) => {

                // Анимация или тикер при необходимости

            });

        }



        initGame();



        // Слой для графики мира

        const worldLayer = new PIXI.Container();

        app.stage.addChild(worldLayer);



        let gravesData = {}; // Хранилище захоронений { "x_y": type }

        let selectedCell = null;



        function createEnvironment() {

            // 1. Трава и дорожки

            for (let r = 0; r < ROWS; r++) {

                for (let c = 0; c < COLS; c++) {

                    const tile = new PIXI.Graphics();

                    let color = (r + c) % 2 === 0 ? 0x2e4a2b : 0x284025;

                    

                    // Центральная крестовая дорожка

                    if (c === Math.floor(COLS/2) || r === Math.floor(ROWS/2)) {

                        color = 0x4d4233; // Цвет каменной дорожки

                    }



                    tile.rect(0, 0, GRID_SIZE, GRID_SIZE);

                    tile.fill(color);

                    tile.x = c * GRID_SIZE;

                    tile.y = r * GRID_SIZE;

                    worldLayer.addChild(tile);

                }

            }



            // 2. Ограда по периметру

            const fenceG = new PIXI.Graphics();

            for (let c = 0; c < COLS; c++) {

                drawFencePart(fenceG, c * GRID_SIZE, 0);

                drawFencePart(fenceG, c * GRID_SIZE, (ROWS - 1) * GRID_SIZE);

            }

            for (let r = 1; r < ROWS - 1; r++) {

                drawFencePart(fenceG, 0, r * GRID_SIZE);

                drawFencePart(fenceG, (COLS - 1) * GRID_SIZE, r * GRID_SIZE);

            }

            worldLayer.addChild(fenceG);



            // 3. Пиксельные деревья по углам и краям

            drawPixelTree(3, 3);

            drawPixelTree(COLS - 4, 3);

            drawPixelTree(3, ROWS - 4);

            drawPixelTree(COLS - 4, ROWS - 4);



            // 4. Интерактивная сетка (клик по земле)

            const interactiveLayer = new PIXI.Graphics();

            interactiveLayer.rect(0, 0, WIDTH, HEIGHT);

            interactiveLayer.fill({ color: 0x000000, alpha: 0 });

            interactiveLayer.eventMode = 'static';

            interactiveLayer.cursor = 'pointer';

            

            interactiveLayer.on('pointerdown', (event) => {

                const localPos = event.getLocalPosition(worldLayer);

                const col = Math.floor(localPos.x / GRID_SIZE);

                const row = Math.floor(localPos.y / GRID_SIZE);



                // Запрещаем ставить на дорожки и забор

                if (col === 0 || col === COLS - 1 || row === 0 || row === ROWS - 1) return;

                if (col === Math.floor(COLS/2) || row === Math.floor(ROWS/2)) return;



                selectedCell = { col, row };

                document.getElementById('modal').style.display = 'block';
